
server:
  port: 8080

spring:
  application:
    name: issues_management
  datasource:
    url: jdbc:mysql://localhost:3306/issues_management?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  # cmd for db to first migration.
  #  mysqldump -u root -p1234 --no-data --skip-comments ai_project | Out-File -Encoding utf8 V1__init_schema.sql
  flyway:
    enabled: false
    #    baseline-on-migrate: true   # allows Flyway to run on a non-empty schema
    #    baseline-version: 1         # marks current schema as version 1
    locations: classpath:db/migration
    validate-on-migrate: true
  threads:
    virtual:
      enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    persist-authorization: true

app:
  security:
    jwt:
      # 64+ byte base64 key for HS256/HS512 signing.
      secret: bXktaW50ZXJuYWwtand0LXNlY3JldC1rZXktZm9yLXByb2plY3Qtd2l0aC1haS0yMDI2LXNlY3VyZS1zdHJpbmc=
      expiration-ms: 86400000
      refresh-expiration-ms: 604800000
    admin:
      full-name: System Admin
      email: admin@example.com
      password: Admin@12345
    api-basic-auth:
      enabled: true
      username: apiuser
      password: ApiPass@123
      role: ADMIN
